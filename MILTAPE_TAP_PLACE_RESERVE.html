.bet5{left:27.2%;top:51.7%;width:22%;height:7.2%}

.bet20{left:73.3%;top:51.7%;width:22%;height:7.2%}

.chatOverlay{position:absolute;left:6.5%;top:88.65%;width:35%;height:3.1%;opacity:0;border:0;outline:0;background:transparent;color:transparent}

.copy{left:78%;top:84.9%;width:17%;height:3.2%}

.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:18px;font-family:Arial,sans-serif}
.modal.show{display:flex}
.box{width:min(430px,94vw);border:1px solid #b72cff;border-radius:18px;background:linear-gradient(145deg,#180622,#05030b);box-shadow:0 0 30px #8d19ff66;padding:18px;color:white}
.box h2{margin:0 0 14px;text-align:center;font-size:21px}
.close{float:right;background:none;border:0;color:#fff;font-size:27px}

}

.tapZone{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.game.active .playVisual{display:none}.game.active .tapZone{display:flex}

<body>
<div class="game" id="game">
  <button class="hot menu" aria-label="Menu"></button>
  <button class="hot timer" aria-label="Chronomètre"></button>
  <button class="hot wallet" aria-label="Solde"></button>
  <button class="hot chatSide" aria-label="Chat global"></button>
  <button class="hot refSide" aria-label="Parrainage"></button>
  <div class="actionBay" id="actionBay">
    <button class="playVisual" id="playVisual">JOUER MAINTENANT&nbsp; ❯</button>
    <div class="tapZone" id="tapZone">
      <button class="tapButton" id="tapButton" aria-label="Taper">TAP</button>
      <div class="tapCount" id="tapCount">0</div>
    </div>
  </div>

  <button class="hot bet1" data-bet="1" aria-label="Mise 1 euro"></button>
  <button class="hot bet5" data-bet="5" aria-label="Mise 5 euros"></button>
  <button class="hot bet10" data-bet="10" aria-label="Mise 10 euros"></button>
  <button class="hot bet20" data-bet="20" aria-label="Mise 20 euros"></button>
  <button class="hot play" id="play" aria-label="Jouer maintenant"></button>

  <input class="chatOverlay" id="chatInput" maxlength="120" aria-label="Message">
  <button class="hot chatSend" id="chatSend" aria-label="Envoyer"></button>
  <button class="hot copy" id="copy" aria-label="Copier"></button>
  <button class="hot share" id="share" aria-label="Partager"></button>

  <button class="hot navChat" id="navChat" aria-label="Chat"></button>
  <button class="hot navPlay" id="navPlay" aria-label="Jouer"></button>
  <button class="hot navRef" id="navRef" aria-label="Parrainage"></button>
</div>

<div class="modal" id="modal">
 <div class="box">
  <button class="close" id="close">×</button>
  <h2>JOUER — <span id="betText">1 €</span></h2>
  <input class="field" id="name" placeholder="Ton nom">
  <input class="field" id="walletInput" placeholder="Adresse wallet TRON (TRC20)">
  <button class="option selected" data-method="tron">🔶 Payer avec TRON — USDT TRC20</button>
  <button class="option" data-method="telegram">✈️ Payer avec Telegram</button>
  <button class="confirm" id="confirm">CONTINUER</button>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const modal=document.getElementById('modal');
const toast=document.getElementById('toast');
const betText=document.getElementById('betText');
let selectedBet=1;
let tapCount=0;

function showToast(t){
 toast.textContent=t;toast.classList.add('show');
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>toast.classList.remove('show'),1800);
}

document.querySelectorAll('[data-bet]').forEach(b=>b.addEventListener('click',()=>{
 selectedBet=Number(b.dataset.bet);
 showToast('Mise sélectionnée : '+selectedBet+' €');
}));

document.getElementById('tapButton').addEventListener('pointerdown',e=>{
 e.preventDefault();
 tapCount++;
 document.getElementById('tapCount').textContent=tapCount;
 document.getElementById('tapButton').animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:90});
 const p=document.createElement('span'); p.className='tapPlus'; p.textContent='+1'; p.style.left=(45+Math.random()*10)+'%'; p.style.top='35%'; document.getElementById('tapZone').appendChild(p); setTimeout(()=>p.remove(),500);
 if(navigator.vibrate)navigator.vibrate(7);
});

document.getElementById('playVisual').onclick=()=>{
 betText.textContent=selectedBet+' €';
 modal.classList.add('show');
};
document.getElementById('close').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};

document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{
 document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
 o.classList.add('selected');
});

document.getElementById('confirm').onclick=()=>{
 const method=document.querySelector('.option.selected').dataset.method;
 const name=document.getElementById('name').value.trim();
 if(!name){showToast('Entre ton nom');return}
 showToast(method==='tron'?'Paiement TRON sélectionné':'Paiement Telegram sélectionné');
 modal.classList.remove('show');
 document.getElementById('game').classList.add('active');
};

document.getElementById('chatSend').onclick=sendChat;
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function sendChat(){
 const v=document.getElementById('chatInput').value.trim();
 if(!v)return;
 showToast('Message envoyé');
 document.getElementById('chatInput').value='';
}

document.getElementById('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText('MILTA123');showToast('Code MILTA123 copié')}
 catch(e){showToast('Code : MILTA123')}
};

document.getElementById('share').onclick=async()=>{
 const link=location.href.split('#')[0]+'?ref=MILTA123';
 if(navigator.share){try{await navigator.share({title:'MILTAPE World Challenge',text:'Rejoins MILTAPE !',url:link})}catch(e){}}
 else{try{await navigator.clipboard.writeText(link);showToast('Lien copié')}catch(e){showToast(link)}}
};

document.getElementById('navChat').onclick=()=>{
 document.getElementById('chatInput').focus();
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
};
document.getElementById('navPlay').onclick=()=>{betText.textContent=selectedBet+' €';modal.classList.add('show')};
document.getElementById('navRef').onclick=()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
document.querySelector('.menu').onclick=()=>showToast('Menu');
document.querySelector('.wallet').onclick=()=>showToast('Solde : 12.45 €');
</script>
</body>
</html>
